name: native-release-artifacts

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Restore native compiler cache
        id: native-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-native-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-native-${{ steps.go.outputs.go-version }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: Build production frontend once
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Prepare native recovery helpers
        working-directory: server
        run: go generate ./internal/agentbundle
      - name: Build and verify six native archives
        working-directory: server
        run: |
          commit="$(git rev-parse HEAD)"
          built_at="$(git show -s --format=%cI HEAD)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            go run ./cmd/jms-package --version "$RELEASE_TAG" --commit "$commit" --built-at "$built_at" --target "$target"
          done
      - name: Save native compiler cache
        if: ${{ always() && !cancelled() && steps.native-cache.outputs.cache-primary-key && steps.native-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Publish immutable artifacts to the existing stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --tag "$RELEASE_TAG" --directory dist --publish
