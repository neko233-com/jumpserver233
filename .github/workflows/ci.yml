name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_race:
        type: boolean
        default: false
        description: Run the complete optional race suite
      external_only:
        type: boolean
        default: false
        description: Rerun only changed external fixture scheduling; reuse unchanged full-suite evidence

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.external_only && 'external' || 'full' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.external_only) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jumpserver
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: jumpserver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jumpserver -d jumpserver_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JMS_TEST_DATABASE_URL: postgres://jumpserver:test-password@127.0.0.1:5432/jumpserver_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Record backend fixture kernel
        run: uname -r
      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Restore race compiler cache
        id: race-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-race-${{ steps.go.outputs.go-version }}-${{ hashFiles('server/go.sum') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-go-race-${{ steps.go.outputs.go-version }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: Test owned fixture lifecycle helpers
        run: node --test server/testsupport/docker-qa.test.mjs server/testsupport/ci-health.test.mjs scripts/docker-qa.test.mjs scripts/qa-lifecycle.test.mjs scripts/qa-retention.test.mjs scripts/publish-release.test.mjs scripts/native-browser-logs.test.mjs scripts/historical-source.test.mjs scripts/ci-cache.test.mjs scripts/ci-fixtures.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test macOS deployment state machine
        run: python3 -B -m unittest discover -s scripts -p macos_single_test.py
      - name: Build embedded native recovery agents
        working-directory: server
        run: go generate ./internal/agentbundle
      - name: Check bilingual content and upstream provenance
        run: node scripts/check-content.mjs
      - name: Start disposable Linux OpenSSH fixture
        env:
          JMS_QA_KEYHOST_SSH_PORT: "12245"
          JMS_QA_KEYHOST_HTTP_PORT: "12246"
          JMS_QA_KEYHOST_PROTECTION: "true"
        run: |
          node server/testsupport/openssh/run.mjs > "$RUNNER_TEMP/keyhost.log" 2>&1 &
          node server/testsupport/openssh/ci-env.mjs
      - name: Start disposable TLS PostgreSQL query fixture
        run: |
          node server/testsupport/postgres/run.mjs > "$RUNNER_TEMP/postgres-query.log" 2>&1 &
          node server/testsupport/postgres/ci-env.mjs
      - name: Start isolated Debian systemd VM
        run: |
          node server/testsupport/systemdvm/run.mjs > "$RUNNER_TEMP/systemd-vm.log" 2>&1 &
          node server/testsupport/systemdvm/ci-env.mjs
      - name: Backend tests (including PostgreSQL HA integration)
        working-directory: server
        env:
          JMS_TEST_RDP_CAPTURE: ${{ runner.temp }}/native-rdp.png
        run: go test -count=1 -timeout 20m -p 1 ./... github.com/microsoft/go-mssqldb github.com/adfnekc/grdp/protocol/sec github.com/adfnekc/grdp/emission
      - name: Backend concurrent-state race regression
        id: race
        working-directory: server
        env:
          JMS_CI_FULL_RACE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_race }}
        run: |
          if [ "$JMS_CI_FULL_RACE" = "true" ]; then
            go test -race -count=1 -timeout 20m -p 1 ./... github.com/microsoft/go-mssqldb github.com/adfnekc/grdp/protocol/sec github.com/adfnekc/grdp/emission
          else
            go test -race -count=1 -timeout 20m -p 1 -run 'History|Directory|Workspace|Input|Backup|Upgrade|Preflight|Drain|Admission|AccessSession|ConnectionScope|ConnectionBinding|NativeStep|Operation|Playbook|ExecGuard|CloseSessionIdempotent|ActiveStandbyFailoverKeepsSharedAuthSession|RequestLogPath|AccessAndPanicLogs' ./internal/storage ./internal/core/executionhistory ./internal/core/jobs ./internal/core/operations ./internal/gateway ./internal/terminalwire ./internal/hostagent ./internal/connector/sshclient ./internal/maintenance ./internal/core/servicemaintenance ./cmd/server ./internal/api
            go test -race -count=1 -timeout 20m -p 1 ./internal/core/auth
          fi
      - name: Retain failed native desktop evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-rdp-failure
          path: ${{ runner.temp }}/native-rdp.png
          if-no-files-found: ignore
      - name: Backend static analysis
        working-directory: server
        run: go vet ./... github.com/microsoft/go-mssqldb github.com/adfnekc/grdp/protocol/sec github.com/adfnekc/grdp/emission
      - name: Backend build
        working-directory: server
        run: go build ./...
      - name: Save race compiler cache
        if: ${{ always() && !cancelled() && (steps.race.outcome == 'success' || steps.race.outcome == 'failure') && steps.race-cache.outputs.cache-primary-key && steps.race-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: ${{ steps.race-cache.outputs.cache-primary-key }}
      - name: Clean disposable backend OpenSSH fixture
        if: always()
        run: node server/testsupport/openssh/ci-env.mjs --cleanup
      - name: Clean disposable PostgreSQL query fixture
        if: always()
        run: node server/testsupport/postgres/ci-env.mjs --cleanup
      - name: Clean disposable SQL and NoSQL fixtures
        if: always()
        run: node server/testsupport/mysql/ci-env.mjs --cleanup
      - name: Clean isolated systemd VM
        if: always()
        run: node server/testsupport/systemdvm/ci-env.mjs --cleanup

  external-integrations:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: relational
            packages: ./internal/connector/mysqlclient ./internal/connector/sqlserverclient
          - group: data
            packages: ./internal/connector/clickhouseclient ./internal/connector/redisclient ./internal/connector/mongodbclient
          - group: access
            packages: ./internal/connector/kubeclient ./internal/connector/telnetclient ./internal/connector/rdpclient ./internal/connector/radiusclient ./internal/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build embedded native recovery agents
        working-directory: server
        run: go generate ./internal/agentbundle
      - name: Test external fixture dispatch
        run: node --test scripts/ci-fixtures.test.mjs server/testsupport/ci-health.test.mjs
      - name: Start external integration OpenSSH gateway
        env:
          JMS_QA_KEYHOST_SSH_PORT: "12245"
          JMS_QA_KEYHOST_HTTP_PORT: "12246"
          JMS_QA_KEYHOST_PROTECTION: "true"
        run: |
          node server/testsupport/openssh/run.mjs > "$RUNNER_TEMP/keyhost.log" 2>&1 &
          node server/testsupport/openssh/ci-env.mjs
      - name: Start memory-isolated external fixtures
        env:
          JMS_CI_FIXTURE_GROUP: ${{ matrix.group }}
        run: node scripts/ci-fixtures.mjs "$JMS_CI_FIXTURE_GROUP"
      - name: External connector and API integrations
        working-directory: server
        env:
          JMS_CI_PACKAGES: ${{ matrix.packages }}
          JMS_TEST_RDP_CAPTURE: ${{ runner.temp }}/native-rdp.png
        run: go test -count=1 -timeout 20m -p 1 $JMS_CI_PACKAGES
      - name: Retain failed native desktop evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-rdp-failure-${{ matrix.group }}
          path: ${{ runner.temp }}/native-rdp.png
          if-no-files-found: ignore
      - name: Clean disposable external fixtures
        if: always()
        run: node server/testsupport/mysql/ci-env.mjs --cleanup
      - name: Clean external integration OpenSSH gateway
        if: always()
        run: node server/testsupport/openssh/ci-env.mjs --cleanup

  frontend:
    # MongoDB's allocator rejects newer runner kernels (SERVER-121912).
    # Keep the real 8.0 fixture on the supported 6.8 runner kernel family.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.external_only) }}
    steps:
      - uses: actions/checkout@v4
      - name: Record frontend fixture kernel
        run: uname -r
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Check bilingual content and upstream provenance
        run: node scripts/check-content.mjs
      - name: Frontend lint
        working-directory: web
        run: pnpm lint
      - name: Install Playwright Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Production browser end-to-end tests (includes build)
        working-directory: web
        run: pnpm test:e2e:production
      - name: Retain compact browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: .cache/qa-reports/
          if-no-files-found: ignore
          retention-days: 3

  docker-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.external_only) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: default-load=true
      - name: Verify clean production images and isolated ports
        run: node scripts/docker-qa.mjs verify
      - name: Retain compact Docker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-qa-receipt
          path: .cache/docker-qa/*/summary*.json
          if-no-files-found: ignore
          retention-days: 3
