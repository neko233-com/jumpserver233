# Synthetic QA identities. This file is not a production RADIUS policy.
clients jmsqa_udp {
 client qa {
  ipaddr = 0.0.0.0/0
  secret = synthetic-radius-shared-secret-233
  require_message_authenticator = yes
 }
}
clients jmsqa_tls {
 client qa {
  ipaddr = 0.0.0.0/0
  secret = radsec
  proto = tls
  require_message_authenticator = yes
 }
}
listen {
 ipaddr = *
 port = 1812
 type = auth
 proto = udp
 clients = jmsqa_udp
 virtual_server = jmsqa
}
listen {
 ipaddr = *
 port = 2083
 type = auth+acct
 proto = tcp
 clients = jmsqa_tls
 virtual_server = jmsqa
 tls {
  private_key_file = /run/qa-tls/server.key
  certificate_file = /run/qa-tls/server.crt
  ca_file = /run/qa-tls/ca.crt
  require_client_cert = yes
  tls_min_version = "1.2"
  fragment_size = 8192
  cache {
   enable = no
  }
 }
}
server jmsqa {
 authorize {
  if (&User-Name == "radius.challenge.qa" && !&State) {
   update control {
    Auth-Type := Accept
    Response-Packet-Type := Access-Challenge
   }
   update reply {
    State := "jms233-challenge-1"
    Message-Authenticator := 0x00000000000000000000000000000000
   }
   return
  }
  if (&User-Name == "radius.qa") {
   update control {
    Cleartext-Password := "synthetic-radius-password-233"
   }
  }
  elsif (&User-Name == "radius.challenge.qa" && &State == "jms233-challenge-1") {
   update control {
    Cleartext-Password := "654321"
   }
  }
  elsif (&User-Name == "radius.factor.qa") {
   update control {
    Cleartext-Password := "654321"
   }
  }
  else {
   reject
  }
  pap
 }
 authenticate {
  Auth-Type PAP {
   pap
  }
 }
 post-auth {
  update reply {
   Message-Authenticator := 0x00000000000000000000000000000000
  }
  Post-Auth-Type REJECT {
   update reply {
    Message-Authenticator := 0x00000000000000000000000000000000
   }
  }
  Post-Auth-Type Challenge {
   update reply {
    Message-Authenticator := 0x00000000000000000000000000000000
   }
  }
 }
}
